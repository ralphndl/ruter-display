services:
  ruter-display:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${PORT:-3030}:3030"
    environment:
      # Keep the container port fixed; PORT above selects the host port.
      PORT: "3030"
    volumes:
      - type: bind
        source: ./config.json
        target: /app/config.json
        read_only: true
        bind:
          create_host_path: false
    # Chromium uses shared memory when generating screenshots.
    shm_size: 256mb
