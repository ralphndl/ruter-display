<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oslo Departures – Independent departure board</title>
<style>
  @font-face {
    font-family: 'Fira Sans';
    src: url('/fonts/FiraSans-Regular.ttf') format('truetype');
    font-style: normal;
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'Fira Sans';
    src: url('/fonts/FiraSans-SemiBold.ttf') format('truetype');
    font-style: normal;
    font-weight: 600;
    font-display: swap;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    --background: #080d14;
    --foreground: #f1f3f4;
    --secondary: #a9b2bf;
    --rule: #303943;
    --hover: #1b2531;
    --live: #79c9ac;
    background: var(--background);
    color: var(--foreground);
    font-family: 'Fira Sans', 'Arial', sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    padding: 24px 28px 16px;
    display: flex;
    flex-direction: column;
    zoom: var(--zoom, 1);
    min-height: calc(100vh / var(--zoom, 1));
  }
  body.light {
    --background: #f8f9fa;
    --foreground: #101820;
    --secondary: #52606e;
    --rule: #c8cfd6;
    --hover: #e6eaee;
    --live: #24745a;
  }
  body.size-small { --zoom: 0.85; }
  body.size-smaller { --zoom: 0.7; }

  header {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 18px;
    margin-bottom: 24px;
  }
  .stop-heading, .header-tools, .stop-icons, .board-name, .group-label {
    display: flex;
    align-items: center;
  }
  .stop-heading { gap: 12px; min-width: 0; }
  .stop-icons { gap: 5px; flex-shrink: 0; }
  #stop-name { font-size: clamp(1.25rem, 2.5vw, 2rem); font-weight: 600; line-height: 1.2; }
  .header-tools { gap: 8px; flex-shrink: 0; }
  #clock { font-size: 2.5rem; line-height: 1; font-variant-numeric: tabular-nums; margin-right: 16px; }
  button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--secondary);
    font: 600 1.125rem 'Fira Sans', sans-serif;
    cursor: pointer;
  }
  button:hover { background: var(--hover); color: var(--foreground); }
  button:focus-visible { outline: 2px solid var(--foreground); outline-offset: 3px; }
  button svg { width: 21px; height: 21px; }

  #boards { display: flex; flex-direction: column; gap: 32px; flex: 1; }
  .board { min-width: 0; container-type: inline-size; }
  .board-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 14px; }
  .board-name { gap: 9px; flex-wrap: wrap; }
  .group + .group { margin-top: 20px; }
  .group-heading, .row {
    display: grid;
    grid-template-columns: 68px minmax(0, 1fr) 94px;
    column-gap: 12px;
    align-items: center;
  }
  .group-heading {
    min-height: 30px;
    padding-bottom: 7px;
    margin-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    font-size: 0.8125rem;
    color: var(--secondary);
  }
  .group-label { grid-column: 1 / 3; gap: 8px; min-width: 0; flex-wrap: wrap; }
  .group-title { font-size: 0.9375rem; font-weight: 600; color: var(--foreground); }
  .column-label { text-align: right; font-weight: 400; }
  .min-hint { font-size: 0.8125rem; font-weight: 400; color: var(--secondary); white-space: nowrap; }
  .min-hint::before { content: '· '; }
  .departures { display: flex; flex-direction: column; gap: 4px; }
  .row { min-height: 52px; padding: 5px 0; }
  .line-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 60px;
    width: 100%;
    min-height: 38px;
    padding: 3px 5px;
    border-radius: 4px;
    font-size: 1.65rem;
    font-weight: 600;
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
    color: #fff;
  }
  /* Flat route plates with the small corner radius of a street departure board. */
  .line-tram { background: #007fba; }
  .line-metro { background: #d76518; }
  .line-bus { background: #d51b29; }
  .line-rail { background: #b84932; }
  .line-water { background: #655296; }
  .line-coach { background: #28764b; }
  .line-other { background: #465361; }
  .destination {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
    font-size: clamp(1.25rem, 4.3cqi, 2.125rem);
    line-height: 1.2;
  }
  .destination-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .transport-icon { width: 28px; height: 22px; display: inline-block; flex-shrink: 0; vertical-align: middle; }
  .destination .transport-icon { width: 24px; height: 20px; color: var(--secondary); }
  .rel-time { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1.2; font-size: clamp(1.25rem, 4.3cqi, 2.125rem); position: relative; }
  .rel-now, .rel-soon, .rel-later { color: var(--foreground); }
  .realtime-dot { position: absolute; right: -10px; top: 0.2em; width: 4px; height: 4px; border-radius: 50%; background: var(--live); }
  .display-footer {
    flex-shrink: 0;
    margin-top: 16px;
    padding-top: 8px;
    border-top: 1px solid var(--rule);
    font-size: 0.75rem;
    line-height: 1.5;
    color: var(--secondary);
  }
  .footer-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 16px; }
  .project-name { font-weight: 600; }
  #status { margin-left: auto; text-align: right; }
  .display-footer a { color: inherit; text-underline-offset: 2px; }
  .display-footer a:hover { color: var(--foreground); }
  .display-footer a:focus-visible { outline: 2px solid var(--foreground); outline-offset: 2px; }
  /* Image consumers cannot scroll: reserve space for attribution in every PNG. */
  body.screenshot { height: calc(100vh / var(--zoom, 1)); overflow: hidden; }
  body.screenshot #boards { min-height: 0; overflow: hidden; }
  .error-msg { font-size: 1rem; line-height: 1.5; color: var(--secondary); padding: 20px 0; }

  @media (min-width: 1000px) and (orientation: landscape) {
    #boards { flex-direction: row; flex-wrap: wrap; gap: 40px; }
    #boards > .board { flex: 1 1 380px; }
    .board + .board { border-left: 1px solid var(--rule); padding-left: 24px; }
  }
  @container (min-width: 650px) {
    .group-heading, .row { grid-template-columns: 80px minmax(0, 1fr) 120px; column-gap: 16px; }
    .row { min-height: 64px; }
    .line-badge { min-height: 44px; font-size: 2rem; }
  }
  @container (max-width: 390px) {
    .group-heading, .row { grid-template-columns: 56px minmax(0, 1fr) 76px; column-gap: 9px; }
    .line-badge { min-width: 0; min-height: 35px; font-size: 1.375rem; }
    .destination .transport-icon { width: 20px; }
  }
  @media (min-width: 1000px) and (max-height: 700px) and (orientation: landscape) {
    body { padding-top: 20px; padding-bottom: 12px; }
    header { padding-bottom: 10px; margin-bottom: 12px; }
    .board-title { margin-bottom: 6px; }
    .row { min-height: 40px; padding: 1px 0; }
    .departures { gap: 2px; }
    .group-heading { min-height: 26px; padding-bottom: 4px; margin-bottom: 4px; }
    .group + .group { margin-top: 10px; }
    .display-footer { margin-top: 10px; }
  }
  @media (max-width: 600px) {
    body { padding: 18px 20px 14px; }
    header { gap: 12px; flex-wrap: wrap; margin-bottom: 20px; padding-bottom: 14px; }
    .stop-heading { flex: 1 1 100%; gap: 8px; }
    .header-tools { width: 100%; }
    #clock { font-size: 2rem; margin-right: auto; }
    #boards { gap: 28px; }
  }
</style>
</head>
<body>

<header>
  <div class="stop-heading">
    <span id="stop-icons" class="stop-icons" aria-hidden="true"></span>
    <h1 id="stop-name">Departures</h1>
  </div>
  <div class="header-tools">
    <span id="clock">--:--</span>
    <button id="size-toggle" title="Text size: normal" aria-label="Text size: normal">Aa</button>
    <button id="theme-toggle" title="Theme: auto" aria-label="Theme: auto"></button>
  </div>
</header>

<main id="boards"><p class="error-msg">Loading departures...</p></main>
<footer class="display-footer">
  <div class="footer-meta">
    <p><span class="project-name">Oslo Departures</span> · Independent project. Not affiliated with or endorsed by Ruter or Entur.</p>
    <p id="status" role="status">Updates every 30 sec</p>
  </div>
  <p class="data-attribution">Data from <a href="https://entur.no/">Entur AS</a> under <a href="https://data.norge.no/nlod">NLOD (data.norge.no/nlod)</a>.
    Filtered and formatted by Oslo Departures; countdowns calculated from departure times.</p>
</footer>

<script>
function updateClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });
}

function relLabel(min, time) {
  if (min <= 0) return { text: 'Now', cls: 'rel-now' };
  if (min === 1) return { text: '1 min', cls: 'rel-now' };
  if (min <= 4) return { text: min + ' min', cls: 'rel-now' };
  if (min <= 10) return { text: min + ' min', cls: 'rel-soon' };
  return { text: time, cls: 'rel-later' };
}

function lineClass(mode) {
  return VALID_MODES.includes(mode) ? `line-${mode}` : 'line-other';
}

// Local, monochrome side-profile pictograms: consistent on every kiosk/browser.
function transportIcon(mode) {
  const bus = '<path d="M3 7h25a2 2 0 0 1 2 2v10H2V9a2 2 0 0 1 1-2Z"/><path d="M5 10h5v4H5zm8 0h5v4h-5zm8 0h6v4h-6z" fill="var(--background)"/><circle cx="8" cy="19" r="3"/><circle cx="24" cy="19" r="3"/><circle cx="8" cy="19" r="1" fill="var(--background)"/><circle cx="24" cy="19" r="1" fill="var(--background)"/>';
  const tram = '<path d="m13 2 5 3-5 3M8 2h12" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 8h23l3 10H2V10a2 2 0 0 1 2-2Z"/><path d="M5 10h5v4H5zm8 0h5v4h-5zm8 0h5l1 4h-6z" fill="var(--background)"/><circle cx="8" cy="19" r="2"/><circle cx="24" cy="19" r="2"/><path d="M2 22h28" stroke="currentColor" stroke-width="1.5"/>';
  const metro = '<path d="M3 7h23l4 5v7H2V9a2 2 0 0 1 1-2Z"/><path d="M5 10h5v4H5zm8 0h5v4h-5zm8 0h4l3 4h-7z" fill="var(--background)"/><circle cx="8" cy="20" r="2"/><circle cx="24" cy="20" r="2"/><path d="M2 23h28" stroke="currentColor" stroke-width="1.5"/>';
  const rail = '<path d="M4 6h20l6 9v4H2V8a2 2 0 0 1 2-2Z"/><path d="M5 9h5v5H5zm8 0h5v5h-5zm8 0h2l4 5h-6z" fill="var(--background)"/><circle cx="8" cy="20" r="2"/><circle cx="23" cy="20" r="2"/><path d="M2 23h28M11 3h9" stroke="currentColor" stroke-width="1.5"/>';
  const water = '<path d="M3 14h27l-5 7H9Zm5-7h16l3 5H6Zm7-5h4v4h-4Z"/><path d="M10 9h4v2h-4zm7 0h4v2h-4z" fill="var(--background)"/><path d="M2 23q3-2 6 0t6 0t6 0t6 0t5 0" fill="none" stroke="currentColor" stroke-width="1.5"/>';
  const shape = { bus, coach: bus, tram, metro, rail, water }[mode];
  return shape ? `<svg class="transport-icon" viewBox="0 0 32 26" fill="currentColor" aria-hidden="true" focusable="false">${shape}</svg>` : '';
}

const MODE_LABELS = { tram: 'Tram', metro: 'Metro', bus: 'Bus', rail: 'Train', water: 'Ferry', coach: 'Coach' };

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

const VALID_MODES = ['tram', 'metro', 'bus', 'rail', 'water', 'coach'];
const params = new URLSearchParams(window.location.search);

let stops = [];   // [{ id, modes }]
let count = 7;
let themeConfig = { default: 'auto', nightStart: '19:00', nightEnd: '07:00' };

function parseModes(str) {
  return (str || '').split(',').map(m => m.trim()).filter(m => VALID_MODES.includes(m));
}

// URL stop entry: "58366", "NSR:StopPlace:58366" or with own modes "58366:tram:metro"
function parseStop(entry, fallbackModes) {
  const tokens = entry.split(':').map(t => t.trim());
  const id = tokens.filter(t => /^\d+$/.test(t)).pop();
  const modes = tokens.filter(t => VALID_MODES.includes(t));
  return id ? { id, modes: modes.length ? modes : fallbackModes } : null;
}

function renderRows(departures, rows, showMode = false) {
  if (!departures.length) return '<p class="error-msg">No departures found</p>';
  return departures.slice(0, rows).map(d => {
    const rel = relLabel(d.diffMin, d.time);
    const soon = d.diffMin <= 4;
    const rt = d.realtime ? '<span class="realtime-dot" title="Realtime" role="img" aria-label="Realtime"></span>' : '';
    const icon = showMode ? transportIcon(d.transportMode) : '';
    return `
      <div class="row${soon ? ' soon' : ''}">
        <div><span class="line-badge ${lineClass(d.transportMode)}" aria-label="${escapeHtml(MODE_LABELS[d.transportMode] || 'Transport')} ${escapeHtml(d.line)}">${escapeHtml(d.line)}</span></div>
        <div class="destination" title="${escapeHtml(d.destination)}">${icon}<span class="destination-text">${escapeHtml(d.destination)}</span></div>
        <div class="rel-time ${rel.cls}">${escapeHtml(rel.text)}${rt}</div>
      </div>`;
  }).join('');
}

async function fetchModes(stopId, modes, minMinutes) {
  const q = new URLSearchParams({ stopId });
  if (modes.length) q.set('modes', modes.join(','));
  if (minMinutes > 0) q.set('minMinutes', minMinutes);
  const res = await fetch(`/api/departures?${q}`);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

// A stop with several modes gets one group per mode, so frequent trams can't push the metro off the list
// minMinutes is either one number for the stop or per mode, e.g. { "metro": 8, "tram": 5 }
function minMinutesFor(stop, modes) {
  const m = stop.minMinutes;
  if (m && typeof m === 'object') return modes.length === 1 ? Number(m[modes[0]]) || 0 : 0;
  return Number(m) || 0;
}

async function fetchStop(stop) {
  const groupModes = stop.modes.length > 1 ? stop.modes.map(m => [m]) : [stop.modes];
  const mins = groupModes.map(modes => minMinutesFor(stop, modes));
  const results = await Promise.all(groupModes.map((modes, i) => fetchModes(stop.id, modes, mins[i])));
  return {
    stopName: results[0].stopName,
    minMinutes: mins.length === 1 ? mins[0] : 0,
    groups: results.map((r, i) => ({ modes: groupModes[i], minMinutes: mins[i], departures: r.departures })),
  };
}

function minHint(min) {
  return min > 0 ? `<span class="min-hint">from ${min} min</span>` : '';
}

// Split the rows of a stop across its groups (7 over 2 → 4 + 3)
function rowsForGroup(index, groups) {
  return Math.max(2, Math.floor(count / groups) + (index < count % groups ? 1 : 0));
}

function modesForGroup(group) {
  return group.modes.length ? group.modes : [...new Set(group.departures.map(d => d.transportMode))];
}

function renderGroups(groups) {
  return groups.map((g, i) => {
    const modes = modesForGroup(g);
    const label = modes.length === 1 ? MODE_LABELS[modes[0]] || 'Departures' : 'Departures';
    return `
      <div class="group">
        <div class="group-heading">
          <div class="group-label">
            <span class="stop-icons">${modes.map(transportIcon).join('')}</span>
            <h3 class="group-title">${label}</h3>${minHint(g.minMinutes)}
          </div>
          <span class="column-label">Expected</span>
        </div>
        <div class="departures">${renderRows(g.departures, groups.length === 1 ? count : rowsForGroup(i, groups.length), modes.length > 1)}</div>
      </div>`;
  }).join('');
}

async function fetchDepartures() {
  const boards = document.getElementById('boards');

  if (!stops.length) {
    boards.innerHTML =
      '<p class="error-msg">No stops configured.<br><br>Add them to config.json or use the URL, e.g.<br>?stopId=58366:tram:metro,58382:tram</p>';
    return;
  }

  try {
    const results = await Promise.all(stops.map(fetchStop));
    const multi = results.length > 1;

    document.getElementById('stop-name').textContent =
      multi ? results.map(r => r.stopName).join(' · ') : results[0].stopName;

    document.getElementById('stop-icons').innerHTML = multi ? ''
      : [...new Set(results[0].groups.flatMap(modesForGroup))].map(transportIcon).join('');

    boards.innerHTML = results.map(r => `
      <section class="board">
        ${multi ? `<h2 class="board-title board-name">${escapeHtml(r.stopName)}</h2>` : ''}
        ${renderGroups(r.groups)}
      </section>`).join('');

    document.getElementById('status').textContent =
      'Updated ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  } catch (e) {
    // Keep the last departures on screen, only flag the problem in the status line
    if (!boards.querySelector('.board')) {
      boards.innerHTML = `<p class="error-msg">Could not fetch departures: ${escapeHtml(e.message)}</p>`;
    }
    document.getElementById('status').textContent = 'Update failed – retrying (' + e.message + ')';
  }
}

// Theme: cycles light → dark → auto; auto is dark between nightStart and nightEnd
const THEME_MODES = ['light', 'dark', 'auto'];
const THEME_ICONS = {
  light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',
  dark: '<path d="M20 14a8 8 0 0 1-10-10 8 8 0 1 0 10 10Z"/>',
  auto: '<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor" stroke="none"/>',
};
const themeToggle = document.getElementById('theme-toggle');

function loadThemeMode() {
  try { return localStorage.getItem('theme'); } catch (e) { return null; }
}

let themeMode = loadThemeMode();

function toMinutes(hhmm) {
  const [h, m] = String(hhmm).split(':').map(Number);
  return h * 60 + (m || 0);
}

function isNight() {
  const now = new Date();
  const cur = now.getHours() * 60 + now.getMinutes();
  const start = toMinutes(themeConfig.nightStart);
  const end = toMinutes(themeConfig.nightEnd);
  return start > end ? (cur >= start || cur < end) : (cur >= start && cur < end);
}

function applyTheme() {
  const mode = THEME_MODES.includes(themeMode) ? themeMode
    : THEME_MODES.includes(themeConfig.default) ? themeConfig.default : 'auto';
  const light = mode === 'light' || (mode === 'auto' && !isNight());
  document.body.classList.toggle('light', light);
  themeToggle.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${THEME_ICONS[mode]}</svg>`;
  themeToggle.title = mode === 'auto'
    ? `Theme: auto (dark ${themeConfig.nightStart}–${themeConfig.nightEnd})`
    : `Theme: ${mode}`;
  themeToggle.setAttribute('aria-label', themeToggle.title);
  return mode;
}

themeToggle.addEventListener('click', () => {
  const current = applyTheme();
  themeMode = THEME_MODES[(THEME_MODES.indexOf(current) + 1) % THEME_MODES.length];
  try { localStorage.setItem('theme', themeMode); } catch (e) { /* not persisted */ }
  applyTheme();
});

// Text size: cycles normal → small → smaller, remembered per browser
const SIZES = ['normal', 'small', 'smaller'];
const sizeToggle = document.getElementById('size-toggle');
let sizeDefault = 'normal';
let size = null;
try { size = localStorage.getItem('size'); } catch (e) { /* not available */ }

function applySize() {
  const current = SIZES.includes(size) ? size : SIZES.includes(sizeDefault) ? sizeDefault : 'normal';
  SIZES.forEach(s => document.body.classList.toggle(`size-${s}`, s === current));
  sizeToggle.title = `Text size: ${current}`;
  sizeToggle.setAttribute('aria-label', sizeToggle.title);
  return current;
}

sizeToggle.addEventListener('click', () => {
  size = SIZES[(SIZES.indexOf(applySize()) + 1) % SIZES.length];
  try { localStorage.setItem('size', size); } catch (e) { /* not persisted */ }
  applySize();
});

// Stops come from the URL if given, otherwise from the server config
async function init() {
  let config = {};
  try {
    const res = await fetch('/api/config');
    config = await res.json();
    if (config.error) throw new Error(config.error);
  } catch (e) {
    document.getElementById('status').textContent = 'Could not load config: ' + e.message;
  }

  themeConfig = { ...themeConfig, ...(config.theme || {}) };
  applyTheme();
  sizeDefault = config.size || 'normal';
  applySize();

  const urlModes = parseModes(params.get('modes'));
  const urlStops = params.get('stopId');
  stops = urlStops
    ? urlStops.split(',').map(e => parseStop(e, urlModes)).filter(Boolean)
    : (config.stops || []).map(st => ({
        id: String(st.id).split(':').pop(),
        modes: urlModes.length ? urlModes : parseModes((st.modes || []).join(',')),
        minMinutes: st.minMinutes,
      }));
  count = parseInt(params.get('count')) || parseInt(config.count) || 7;

  fetchDepartures();
  setInterval(fetchDepartures, 30000);
}

function tick() {
  updateClock();
  applyTheme();
}

applyTheme();
applySize();
tick();
setInterval(tick, 10000);
init();
</script>
</body>
</html>
